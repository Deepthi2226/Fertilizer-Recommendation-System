<!DOCTYPE html>
<html>
<head>
    <title>🌿 Fertilizer Recommendation Result</title>
    <style>
        body {
            display: flex;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .result-section {
            flex: 1;
            background-color: #f5fff5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h2 {
            color: #2e7d32;
            font-size: 28px;
        }

        h3 {
            color: #388e3c;
            background: #e8f5e9;
            padding: 15px 25px;
            border-radius: 10px;
        }

        a {
            margin-top: 20px;
            text-decoration: none;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }

        a:hover {
            background: #45a049;
        }

        .image-section {
            flex: 1;
            background: white url('https://tse3.mm.bing.net/th/id/OIP.OCvVl4oVGBCh0d-c4do9QwHaEK?pid=Api&P=0&h=180') no-repeat center right;
            background-size: contain; /* show full image */
        }
    </style>
</head>
<body>
    <div class="result-section">
        <h2>✅ Recommended Fertilizer</h2>
        <h3>{{ fertilizer }}</h3>
        <a href="/">🔙 Back to Form</a>
    </div>

    <div class="image-section"></div>
</body>
</html>
